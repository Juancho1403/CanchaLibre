# PostgreSQL local para CanchaYa (sin SQLite)
services:
  db:
    image: postgres:16-alpine
    container_name: canchaya-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: canchaya
    ports:
      - "5432:5432"
    volumes:
      - canchaya_pgdata:/var/lib/postgresql/data

volumes:
  canchaya_pgdata:
